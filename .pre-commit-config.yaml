minimum_prek_version: "0.5.3"
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
exclude: ^(\.claude/skills/speckit-[^/]+/|\.agents/skills/speckit-[^/]+/|\.specify/(scripts|templates|workflows|integrations)/|\.specify/[^/]+\.json$|\.specify/\.gitignore$|\.specify/memory/\.constitution-template\.json$|bun/tests/integration/registry/modules/)
repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 8.5.1.3
    hooks:
      # The npm fixture sources are JavaScript whatever their names (BUILD,
      # build.bazel); pack.ts packs them byte for byte.
      - id: buildifier
        exclude: ^bun/tests/npm/registry/packages/
      - id: buildifier-lint
        exclude: ^bun/tests/npm/registry/packages/
  - repo: https://github.com/crate-ci/typos
    rev: v1.50.1
    hooks:
      - id: typos
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.18.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
